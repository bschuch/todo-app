name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Restore Dependencies
        run: dotnet restore TodoBackend/TodoBackend.csproj

      - name: 🏗️ Build Backend
        run: dotnet build TodoBackend/TodoBackend.csproj --no-restore --configuration Release

      - name: 🧪 Run Tests
        # If your tests are in a separate folder (e.g., TodoBackend.Tests), target that project here:
        run: dotnet test --configuration Release --verbosity normal

  frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: todo-frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./todo-frontend
        run: npm ci

      - name: 🏗️ Build React App
        working-directory: ./todo-frontend
        run: npm run build
