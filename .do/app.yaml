name: family-organizer
region: nyc
static_sites:
  - name: family-organizer-web
    github:
      repo: bschuch/todo-app
      branch: main
      deploy_on_push: true
    source_dir: todo-frontend
    build_command: npm ci && npm run build
    output_dir: dist
    envs:
      - key: VITE_GRAPHQL_URL
        scope: BUILD_TIME
        value: ${family-organizer-api.PUBLIC_URL}/graphql
services:
  - name: family-organizer-api
    github:
      repo: bschuch/todo-app
      branch: main
      deploy_on_push: true
    source_dir: TodoBackend
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: dotnet publish TodoBackend.csproj -c Release -o out
    run_command: dotnet out/TodoBackend.dll
    routes:
      - path: /
    envs:
      - key: ASPNETCORE_ENVIRONMENT
        scope: RUN_TIME
        value: Production
      - key: Mongo__ConnectionString
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_MANAGED_MONGODB_CONNECTION_STRING
      - key: Mongo__DatabaseName
        scope: RUN_TIME
        value: TodoDatabase
      - key: Cors__AllowedOrigins__0
        scope: RUN_TIME
        value: ${family-organizer-web.PUBLIC_URL}
